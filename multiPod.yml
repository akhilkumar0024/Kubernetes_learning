apiVersion: v1
kind: Pod
metadata: 
    name: multipod
    labels:
      app: multicontainer-pod
spec:
  container:
    - name: nginx-container
      image: nginx:latest
      ports: 
       - containerPort: 80
      volumeMounts:
        - name: nginx-log
          mountPath: /var/log/nginx 
    - name: log-container
      image: busybox
      command: ["sh", "-c"]
      args: ["tail -f /var/log/nginx/access.log"]
      volumeMounts:
        - name: nginx-log
          mountPath: /var/log/nginx 
  volumes:
   - name: nginx-log
     emptyDir: {} 